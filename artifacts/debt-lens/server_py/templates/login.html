{% extends "base.html" %}
{% block title %}تسجيل الدخول - DebtLens{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 3rem auto;">
  <h1 style="margin-top:0; font-size:1.5rem;">تسجيل الدخول</h1>
  <p class="muted">سجّل دخولك للوصول إلى ملفك المالي في DebtLens.</p>

  {% if not firebase_enabled %}
  <p class="badge badge-warn">تسجيل الدخول غير متاح مؤقتًا (لم يتم إعداد Firebase على الخادم)</p>
  {% endif %}

  <form id="login-form">
    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" name="email" required />

    <label for="password">كلمة المرور</label>
    <input type="password" id="password" name="password" required />

    <button type="submit" class="btn" style="width:100%;">دخول</button>
  </form>
</div>
{% endblock %}
