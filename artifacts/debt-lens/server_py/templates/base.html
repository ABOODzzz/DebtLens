<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}DebtLens{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f1f33;
      --navy-deep: #0c1a2b;
      --gold: #e0b02e;
      --gold-soft: #f3d98b;
      --pale: #f5f7f9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      background: var(--pale);
      color: var(--navy);
    }
    header.topbar {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
      color: var(--gold-soft);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header.topbar .brand {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0.5px;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(15, 31, 51, 0.08);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(224, 176, 46, 0.15);
    }
    .btn {
      display: inline-block;
      background: var(--gold);
      color: var(--navy-deep);
      font-weight: 700;
      padding: 0.65rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      font-size: 1rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn-outline {
      background: transparent;
      color: var(--navy);
      border: 1.5px solid var(--navy);
    }
    input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #d8dee6;
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.35rem;
      color: var(--navy);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .badge-warn { background: #fdf1d6; color: #9a6b06; }
    .badge-danger { background: none; }
    .muted { color: #5a6b7f; font-size: 0.9rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <span class="brand">DebtLens</span>
    {% block header_extra %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
