kind = "web"
previewPath = "/"
title = "DebtLens"
description = "An Arabic RTL financial wellness app for people in Jordan to understand their income, bank accounts, and debt across lending companies and payment apps."
version = "1.0.0"
id = "artifacts/debt-lens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25675

[services.development]
run = "bash dev.sh"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/debt-lens", "run", "build"]

[services.production.run]
args = ["bash", "artifacts/debt-lens/prod.sh"]

[services.production.run.env]
PORT = "25675"
BASE_PATH = "/"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "25675"
BASE_PATH = "/"
