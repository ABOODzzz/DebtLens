kind = "web"
previewPath = "/"
title = "DebtLens"
description = "An Arabic RTL financial wellness app for people in Jordan to understand their income, bank accounts, and debt across lending companies and payment apps."
version = "1.0.0"
id = "artifacts/debt-lens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25675

[services.development]
run = "cd server_py && python3 run.py --reload"

[services.production.run]
args = ["python3", "artifacts/debt-lens/server_py/run.py"]

[services.production.run.env]
PORT = "25675"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "25675"
