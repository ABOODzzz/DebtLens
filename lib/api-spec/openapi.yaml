openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: kyc
    description: KYC review operations
  - name: content
    description: Public content
  - name: finance
    description: Financial analysis operations
  - name: guarantor
    description: Digital guarantor operations
  - name: admin
    description: Admin-only review operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /kyc/submit:
    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit a KYC profile for server-side review
      description: Verifies the Firebase bearer token and returns a review status decided by the server.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycSubmitInput"
      responses:
        "200":
          description: Review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmitResponse"
        "400":
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Review service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /headlines:
    get:
      operationId: getHeadlines
      tags: [content]
      summary: List news ticker headlines
      responses:
        "200":
          description: Headlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Headline"
  /financial-summary:
    get:
      operationId: getFinancialSummary
      tags: [finance]
      summary: Compute a summary of the signed-in user's income and debts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyze:
    post:
      operationId: analyzeFinances
      tags: [finance]
      summary: Run a transaction or full financial data analysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /manual-obligations:
    post:
      operationId: saveManualObligations
      tags: [finance]
      summary: Save monthly obligations for a customer without a bank account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualObligationsInput"
      responses:
        "200":
          description: Saved monthly obligations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualObligationsResult"
        "400":
          description: Invalid obligation amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /restructure:
    post:
      operationId: getRestructurePlan
      tags: [finance]
      summary: Generate a debt restructuring plan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restructuring plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestructureResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No active loans to restructure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /advice:
    post:
      operationId: getAdvice
      tags: [finance]
      summary: Get AI-generated personalized financial advice
      security:
        - bearerAuth: []
      responses:
        "200":
          description: AI advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdviceResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /consolidation-request:
    post:
      operationId: requestConsolidation
      tags: [finance]
      summary: Request loan consolidation across financing institutions
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Consolidation request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsolidationRequestResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Fewer than 2 financing institutions on file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai-loan-assessment:
    post:
      operationId: assessLoanEligibility
      tags: [finance]
      summary: AI-assisted financing eligibility check
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Eligibility assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEligibilityResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /loan-application:
    post:
      operationId: submitLoanApplication
      tags: [finance]
      summary: Submit a new financing application
      description: Runs the AI eligibility assessment and persists an application record; when the applicant's DTI only qualifies with a digital guarantor, the application is created with status awaiting_guarantor instead of being rejected outright.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationInput"
      responses:
        "200":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI or database service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getCurrentLoanApplication
      tags: [finance]
      summary: Get the applicant's most recent loan application
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Most recent application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No application submitted yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /loan-application/attach-guarantor:
    post:
      operationId: attachGuarantorToApplication
      tags: [finance]
      summary: Link a just-requested digital guarantor relationship to an awaiting_guarantor application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachGuarantorInput"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"
        "400":
          description: Application isn't awaiting a guarantor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guarantor/request:
    post:
      operationId: requestGuarantor
      tags: [guarantor]
      summary: Request another verified customer to act as a digital guarantor
      description: Looks the person up by national ID, checks they're verified and in good financial standing, then creates a pending request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuarantorRequestInput"
      responses:
        "200":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuarantorRequestResult"
        "400":
          description: Invalid request (self-guarantee, unverified/over-leveraged guarantor)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user found with that national ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guarantor/respond:
    post:
      operationId: respondToGuarantorRequest
      tags: [guarantor]
      summary: Approve or decline an incoming guarantor request
      description: Approving raises the relationship to awaiting_admin_review; the guarantee only activates once an admin makes the final decision.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuarantorRespondInput"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuarantorRespondResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No pending relationship with this id naming you as guarantor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guarantor/network:
    get:
      operationId: getGuarantorNetwork
      tags: [guarantor]
      summary: Get the signed-in user's digital guarantor network
      description: Returns every guarantor relationship where this user is the requester or the guarantor (a user may have several of each), plus their remaining capacity on both sides.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Guarantor network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuarantorNetwork"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications:
    get:
      operationId: listNotifications
      tags: [guarantor]
      summary: List the signed-in user's in-app notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsList"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications/mark-read:
    post:
      operationId: markNotificationRead
      tags: [guarantor]
      summary: Mark one notification as read
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkNotificationReadInput"
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkNotificationReadResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [guarantor]
      summary: Mark all of the signed-in user's unread notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllNotificationsReadResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users for the admin review dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All users with review/KYC/financial summary fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{uid}:
    get:
      operationId: getAdminUserDetail
      tags: [admin]
      summary: Full detail for one customer -- KYC photos, extracted identity, and complete financial profile
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/guarantor-requests:
    get:
      operationId: listGuarantorRequests
      tags: [admin]
      summary: List digital guarantor requests awaiting or already given an admin decision
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Guarantor requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuarantorRequestsList"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/guarantor-insight:
    post:
      operationId: getGuarantorInsight
      tags: [admin]
      summary: AI-assisted comparison of a requester and their proposed digital guarantor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuarantorInsightInput"
      responses:
        "200":
          description: Guarantor insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuarantorInsightResult"
        "400":
          description: No guarantor request found for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/guarantor-decision:
    post:
      operationId: submitGuarantorDecision
      tags: [admin]
      summary: Final admin approve/reject decision on a digital guarantor request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuarantorDecisionInput"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuarantorDecisionResult"
        "400":
          description: No guarantor request awaiting admin review for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/guarantor-revise:
    post:
      operationId: reviseGuarantorDecision
      tags: [admin]
      summary: Revise a recently-made final admin decision on a digital guarantor request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuarantorReviseInput"
      responses:
        "200":
          description: Guarantor decision revised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuarantorDecisionResult"
        "400":
          description: Guarantor decision hasn't received a final decision yet, or the revision window has passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Guarantor relationship not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/loan-applications:
    get:
      operationId: listLoanApplications
      tags: [admin]
      summary: List loan applications awaiting or already given a final admin disbursement decision
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Loan applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoanApplicationsList"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/loan-application-decision:
    post:
      operationId: submitLoanApplicationDecision
      tags: [admin]
      summary: Final admin approve/reject decision on a submitted loan application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationDecisionInput"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"
        "400":
          description: Application isn't awaiting a final admin decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Loan application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/loan-application-revise:
    post:
      operationId: reviseLoanApplicationDecision
      tags: [admin]
      summary: Revise a recently-made final admin decision on a loan application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationReviseInput"
      responses:
        "200":
          description: Decision revised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanApplication"
        "400":
          description: Application hasn't received a final decision yet, or the revision window has passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Loan application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/kyc-decision:
    post:
      operationId: submitKycDecision
      tags: [admin]
      summary: Manually approve or reject a user's KYC review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycDecisionInput"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycDecisionResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    KycSubmitInput:
      type: object
      required:
        - profile
        - photoPaths
      properties:
        profile:
          type: object
          additionalProperties: true
        photoPaths:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
    KycSubmitResponse:
      type: object
      required:
        - reviewStatus
      properties:
        reviewStatus:
          type: string
          enum: [approved, pending, rejected]
        reason:
          type: ["string", "null"]
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    Headline:
      type: object
      required:
        - id
        - text
        - publishedAt
      properties:
        id:
          type: integer
        text:
          type: string
        source:
          type: ["string", "null"]
        publishedAt:
          type: string
          format: date-time
    FinancialSummary:
      type: object
      required:
        - totalMonthlyIncome
        - totalMonthlyDebtPayments
        - totalRemainingDebt
        - activeLoansCount
        - financingInstitutionsCount
        - debtToIncomeRatio
        - hasActiveLoans
        - hasMultipleFinancingInstitutions
      properties:
        totalMonthlyIncome:
          type: number
        totalMonthlyDebtPayments:
          type: number
        totalRemainingDebt:
          type: number
        activeLoansCount:
          type: integer
        financingInstitutionsCount:
          type: integer
        debtToIncomeRatio:
          type: number
        hasActiveLoans:
          type: boolean
        hasMultipleFinancingInstitutions:
          type: boolean
        dataSource:
          type: string
          description: >
            Whether these figures come from admin-verified statements,
            self-reported onboarding data, or nothing yet.
          enum: [verified, self_reported, none]
    AnalyzeInput:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [transactions, full]
    ManualObligation:
      type: object
      required: [category, label, amount]
      properties:
        category:
          type: string
        label:
          type: string
        amount:
          type: number
          minimum: 0
    ManualObligationsInput:
      type: object
      required: [obligations]
      properties:
        obligations:
          type: array
          items:
            $ref: "#/components/schemas/ManualObligation"
    ManualObligationsResult:
      type: object
      required: [obligations, totalMonthlyObligations]
      properties:
        obligations:
          type: array
          items:
            $ref: "#/components/schemas/ManualObligation"
        totalMonthlyObligations:
          type: number
    BudgetBreakdownItem:
      type: object
      required: [category, amount]
      properties:
        category:
          type: string
        amount:
          type: number
    DebtBreakdownItem:
      type: object
      required:
        - lenderName
        - remainingAmount
        - startDate
      properties:
        lenderName:
          type: string
        remainingAmount:
          type: number
        startDate:
          type: string
        estimatedMonthlyBurden:
          type: number
    AnalyzeResult:
      type: object
      required:
        - awaitingVerification
      properties:
        awaitingVerification:
          type: boolean
          description: >
            True when the user has no admin-verified statements yet, in
            which case only `message` is populated and every other field
            is omitted.
        message:
          type: string
        type:
          type: string
          enum: [transactions, full]
        summary:
          type: string
        debtBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/DebtBreakdownItem"
        totalRemainingDebt:
          type: number
        monthlyIncome:
          type: number
        monthlyObligations:
          type: number
        disposableIncome:
          type: number
        debtToIncomeRatio:
          type: number
        budgetBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/BudgetBreakdownItem"
        insights:
          type: array
          items:
            type: string
    RestructureStep:
      type: object
      required:
        - lenderName
        - action
        - detail
      properties:
        lenderName:
          type: string
        action:
          type: string
        detail:
          type: string
    RestructureResult:
      type: object
      required:
        - awaitingVerification
      properties:
        awaitingVerification:
          type: boolean
          description: >
            True when the user has no admin-verified statements yet (or no
            active loans to restructure), in which case only `message` is
            populated and every other field is omitted.
        message:
          type: string
        currentMonthlyBurden:
          type: number
        targetMonthlyBurden:
          type: number
        currentDebtToIncomeRatio:
          type: number
        targetDebtToIncomeRatio:
          type: number
        months:
          type: integer
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RestructureStep"
    AdviceResult:
      type: object
      required:
        - awaitingVerification
      properties:
        awaitingVerification:
          type: boolean
          description: >
            True when the user has no admin-verified statements yet, in
            which case only `message` is populated and every other field
            is omitted.
        message:
          type: string
        advice:
          type: string
        generatedAt:
          type: string
          format: date-time
    ConsolidationRequestResult:
      type: object
      required:
        - awaitingVerification
      properties:
        awaitingVerification:
          type: boolean
          description: >
            True when the user has no admin-verified statements yet (or
            fewer than two financing institutions on file), in which case
            only `message` is populated and every other field is omitted.
        message:
          type: string
        id:
          type: integer
        status:
          type: string
          enum: [submitted]
        estimatedConsolidatedMonthlyPayment:
          type: number
        institutionsIncluded:
          type: integer
        createdAt:
          type: string
          format: date-time
    LoanEligibilityResult:
      type: object
      required:
        - eligible
        - riskTier
        - creditScore
        - creditScoreLabel
        - creditScoreColor
        - guarantorBacked
        - recommendation
        - basedOnRealData
        - currentDebtToIncomePercentage
      properties:
        eligible:
          type: boolean
        riskTier:
          type: string
        creditScore:
          type: integer
          description: General credit score on a 300-850 scale.
        creditScoreLabel:
          type: string
        creditScoreColor:
          type: string
        guarantorBacked:
          type: boolean
        recommendedAmount:
          type: ["number", "null"]
        interestRate:
          type: ["number", "null"]
        termMonths:
          type: ["integer", "null"]
        monthlyInstallment:
          type: ["number", "null"]
        totalRepayment:
          type: ["number", "null"]
        recommendation:
          type: string
        basedOnRealData:
          type: boolean
        currentDebtToIncomePercentage:
          type: number
    LoanApplication:
      type: object
      required:
        - id
        - uid
        - requested_amount
        - purpose
        - status
        - requires_guarantor
        - eligible
        - recommendation
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        uid:
          type: string
        requested_amount:
          type: number
        purpose:
          type: string
        status:
          type: string
          enum: [awaiting_guarantor, submitted, approved, admin_rejected, rejected]
        requires_guarantor:
          type: boolean
        guarantor_relationship_id:
          type: ["string", "null"]
        admin_decision_reason:
          type: ["string", "null"]
        eligible:
          type: boolean
        risk_tier:
          type: ["string", "null"]
        credit_score:
          type: ["integer", "null"]
        recommended_amount:
          type: ["number", "null"]
        interest_rate:
          type: ["number", "null"]
        term_months:
          type: ["integer", "null"]
        monthly_installment:
          type: ["number", "null"]
        total_repayment:
          type: ["number", "null"]
        recommendation:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LoanApplicationInput:
      type: object
      required:
        - requested_amount
        - purpose
      properties:
        requested_amount:
          type: number
        purpose:
          type: string
    AttachGuarantorInput:
      type: object
      required:
