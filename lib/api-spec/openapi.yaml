openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: kyc
    description: KYC review operations
  - name: content
    description: Public content
  - name: finance
    description: Financial analysis operations
  - name: guarantor
    description: Digital guarantor operations
  - name: admin
    description: Admin-only review operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /kyc/submit:
    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit a KYC profile for server-side review
      description: Verifies the Firebase bearer token and returns a review status decided by the server.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycSubmitInput"
      responses:
        "200":
          description: Review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmitResponse"
        "400":
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Review service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /headlines:
    get:
      operationId: getHeadlines
      tags: [content]
      summary: List news ticker headlines
      responses:
        "200":
          description: Headlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Headline"
  /financial-summary:
    get:
      operationId: getFinancialSummary
      tags: [finance]
      summary: Compute a summary of the signed-in user's income and debts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyze:
    post:
      operationId: analyzeFinances
      tags: [finance]
      summary: Run a transaction or full financial data analysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /restructure:
    post:
      operationId: getRestructurePlan
      tags: [finance]
      summary: Generate a debt restructuring plan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restructuring plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestructureResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No active loans to restructure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /advice:
    post:
      operationId: getAdvice
      tags: [finance]
      summary: Get AI-generated personalized financial advice
      security:
        - bearerAuth: []
      responses:
        "200":
          description: AI advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdviceResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /consolidation-request:
    post:
      operationId: requestConsolidation
      tags: [finance]
      summary: Request loan consolidation across financing institutions
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Consolidation request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsolidationRequestResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Fewer than 2 financing institutions on file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai-loan-assessment:
    post:
      operationId: assessLoanEligibility
      tags: [finance]
      summary: AI-assisted financing eligibility check
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Eligibility assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEligibilityResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /guarantor/status:
    get:
      operationId: getGuarantorStatus
      tags: [guarantor]
      summary: Get the signed-in user's digital guarantor status
      description: Returns any outgoing guarantor request, the approved guarantor (if any), and incoming requests naming this user as guarantor.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Guarantor status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuarantorStatus"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users for the admin review dashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All users with review/KYC/financial summary fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/kyc-decision:
    post:
      operationId: submitKycDecision
      tags: [admin]
      summary: Manually approve or reject a user's KYC review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycDecisionInput"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycDecisionResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    KycSubmitInput:
      type: object
      required:
        - profile
        - photoPaths
      properties:
        profile:
          type: object
          additionalProperties: true
        photoPaths:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
    KycSubmitResponse:
      type: object
      required:
        - reviewStatus
      properties:
        reviewStatus:
          type: string
          enum: [approved, pending, rejected]
        reason:
          type: ["string", "null"]
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    Headline:
      type: object
      required:
        - id
        - text
        - publishedAt
      properties:
        id:
          type: integer
        text:
          type: string
        source:
          type: ["string", "null"]
        publishedAt:
          type: string
          format: date-time
    FinancialSummary:
      type: object
      required:
        - totalMonthlyIncome
        - totalMonthlyDebtPayments
        - totalRemainingDebt
        - activeLoansCount
        - financingInstitutionsCount
        - debtToIncomeRatio
        - hasActiveLoans
        - hasMultipleFinancingInstitutions
      properties:
        totalMonthlyIncome:
          type: number
        totalMonthlyDebtPayments:
          type: number
        totalRemainingDebt:
          type: number
        activeLoansCount:
          type: integer
        financingInstitutionsCount:
          type: integer
        debtToIncomeRatio:
          type: number
        hasActiveLoans:
          type: boolean
        hasMultipleFinancingInstitutions:
          type: boolean
        dataSource:
          type: string
          description: >
            Whether these figures come from admin-verified statements,
            self-reported onboarding data, or nothing yet.
          enum: [verified, self_reported, none]
    AnalyzeInput:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [transactions, full]
    DebtBreakdownItem:
      type: object
      required:
        - lenderName
        - remainingAmount
        - startDate
      properties:
        lenderName:
          type: string
        remainingAmount:
          type: number
        startDate:
          type: string
        estimatedMonthlyBurden:
          type: number
    AnalyzeResult:
      type: object
      required:
        - type
        - summary
        - debtBreakdown
        - totalRemainingDebt
        - debtToIncomeRatio
        - insights
      properties:
        type:
          type: string
          enum: [transactions, full]
        summary:
          type: string
        debtBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/DebtBreakdownItem"
        totalRemainingDebt:
          type: number
        debtToIncomeRatio:
          type: number
        insights:
          type: array
          items:
            type: string
    RestructureStep:
      type: object
      required:
        - lenderName
        - action
        - detail
      properties:
        lenderName:
          type: string
        action:
          type: string
        detail:
          type: string
    RestructureResult:
      type: object
      required:
        - currentMonthlyBurden
        - targetMonthlyBurden
        - currentDebtToIncomeRatio
        - targetDebtToIncomeRatio
        - months
        - steps
      properties:
        currentMonthlyBurden:
          type: number
        targetMonthlyBurden:
          type: number
        currentDebtToIncomeRatio:
          type: number
        targetDebtToIncomeRatio:
          type: number
        months:
          type: integer
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RestructureStep"
    AdviceResult:
      type: object
      required:
        - advice
        - generatedAt
      properties:
        advice:
          type: string
        generatedAt:
          type: string
          format: date-time
    ConsolidationRequestResult:
      type: object
      required:
        - id
        - status
        - estimatedConsolidatedMonthlyPayment
        - institutionsIncluded
        - createdAt
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [submitted]
        estimatedConsolidatedMonthlyPayment:
          type: number
        institutionsIncluded:
          type: integer
        createdAt:
          type: string
          format: date-time
    LoanEligibilityResult:
      type: object
      required:
        - eligible
        - riskTier
        - creditScore
        - creditScoreLabel
        - creditScoreColor
        - guarantorBacked
        - recommendation
        - basedOnRealData
        - currentDebtToIncomePercentage
      properties:
        eligible:
          type: boolean
        riskTier:
          type: string
        creditScore:
          type: integer
          description: General credit score on a 300-850 scale.
        creditScoreLabel:
          type: string
        creditScoreColor:
          type: string
        guarantorBacked:
          type: boolean
        recommendedAmount:
          type: number
          nullable: true
        interestRate:
          type: number
          nullable: true
        termMonths:
          type: integer
          nullable: true
        monthlyInstallment:
          type: number
          nullable: true
        totalRepayment:
          type: number
          nullable: true
        recommendation:
          type: string
        basedOnRealData:
          type: boolean
        currentDebtToIncomePercentage:
          type: number
    GuarantorRequestStatus:
      type: object
      required:
        - guarantorUid
        - status
        - maxAmount
      properties:
        guarantorUid:
          type: string
        status:
          type: string
          enum: [pending, approved, declined]
        requestedAt:
          type: ["string", "null"]
          format: date-time
        respondedAt:
          type: ["string", "null"]
          format: date-time
        maxAmount:
          type: number
    IncomingGuarantorRequest:
      type: object
      required:
        - status
        - maxAmount
      properties:
        status:
          type: string
          enum: [pending, approved, declined]
        requestedAt:
          type: ["string", "null"]
          format: date-time
        maxAmount:
          type: number
    GuarantorStatus:
      type: object
      required:
        - approved_guarantor_uid
        - incoming_requests
      properties:
        outgoing_request:
          anyOf:
            - $ref: "#/components/schemas/GuarantorRequestStatus"
            - type: "null"
        approved_guarantor_uid:
          type: ["string", "null"]
        incoming_requests:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/IncomingGuarantorRequest"
    AdminUser:
      type: object
      required:
        - uid
        - name
        - review_status
        - has_kyc_submission
        - data_source
        - stacking_flag
        - statement_count
      properties:
        uid:
          type: string
        name:
          type: string
        national_id:
          type: ["string", "null"]
        review_status:
          type: string
          enum: [pending, approved, rejected, no_submission]
        review_reason:
          type: ["string", "null"]
        face_match:
          type: ["boolean", "null"]
        confidence:
          type: ["number", "null"]
        has_kyc_submission:
          type: boolean
        data_source:
          type: string
        debt_to_income_percentage:
          type: ["number", "null"]
        stacking_flag:
          type: boolean
        statement_count:
          type: integer
        guarantor_uid:
          type: ["string", "null"]
        updated_at:
          type: ["string", "null"]
          format: date-time
    AdminUsersResponse:
      type: object
      required:
        - user_count
        - pending_count
        - users
      properties:
        user_count:
          type: integer
        pending_count:
          type: integer
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
    KycDecisionInput:
      type: object
      required:
        - uid
        - decision
      properties:
        uid:
          type: string
        decision:
          type: string
          enum: [approved, rejected]
        note:
          type: ["string", "null"]
    KycDecisionResult:
      type: object
      required:
        - uid
        - review_status
        - reason
      properties:
        uid:
          type: string
        review_status:
          type: string
          enum: [approved, rejected]
        reason:
          type: string

