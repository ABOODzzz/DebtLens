openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: kyc
    description: KYC review operations
  - name: content
    description: Public content
  - name: finance
    description: Financial analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /kyc/submit:
    post:
      operationId: submitKyc
      tags: [kyc]
      summary: Submit a KYC profile for server-side review
      description: Verifies the Firebase bearer token and returns a review status decided by the server.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycSubmitInput"
      responses:
        "200":
          description: Review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmitResponse"
        "400":
          description: Invalid submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Review service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /headlines:
    get:
      operationId: getHeadlines
      tags: [content]
      summary: List news ticker headlines
      responses:
        "200":
          description: Headlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Headline"
  /financial-summary:
    get:
      operationId: getFinancialSummary
      tags: [finance]
      summary: Compute a summary of the signed-in user's income and debts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyze:
    post:
      operationId: analyzeFinances
      tags: [finance]
      summary: Run a transaction or full financial data analysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeInput"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /restructure:
    post:
      operationId: getRestructurePlan
      tags: [finance]
      summary: Generate a debt restructuring plan
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restructuring plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestructureResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No active loans to restructure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /advice:
    post:
      operationId: getAdvice
      tags: [finance]
      summary: Get AI-generated personalized financial advice
      security:
        - bearerAuth: []
      responses:
        "200":
          description: AI advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdviceResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /consolidation-request:
    post:
      operationId: requestConsolidation
      tags: [finance]
      summary: Request loan consolidation across financing institutions
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Consolidation request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsolidationRequestResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Fewer than 2 financing institutions on file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai-loan-assessment:
    post:
      operationId: assessLoanEligibility
      tags: [finance]
      summary: AI-assisted financing eligibility check
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Eligibility assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEligibilityResult"
        "401":
          description: Missing or invalid Firebase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    KycSubmitInput:
      type: object
      required:
        - profile
        - photoPaths
      properties:
        profile:
          type: object
          additionalProperties: true
        photoPaths:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: string
    KycSubmitResponse:
      type: object
      required:
        - reviewStatus
      properties:
        reviewStatus:
          type: string
          enum: [approved, pending, rejected]
        reason:
          type: ["string", "null"]
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    Headline:
      type: object
      required:
        - id
        - text
        - publishedAt
      properties:
        id:
          type: integer
        text:
          type: string
        source:
          type: ["string", "null"]
        publishedAt:
          type: string
          format: date-time
    FinancialSummary:
      type: object
      required:
        - totalMonthlyIncome
        - totalMonthlyDebtPayments
        - totalRemainingDebt
        - activeLoansCount
        - financingInstitutionsCount
        - debtToIncomeRatio
        - hasActiveLoans
        - hasMultipleFinancingInstitutions
      properties:
        totalMonthlyIncome:
          type: number
        totalMonthlyDebtPayments:
          type: number
        totalRemainingDebt:
          type: number
        activeLoansCount:
          type: integer
        financingInstitutionsCount:
          type: integer
        debtToIncomeRatio:
          type: number
        hasActiveLoans:
          type: boolean
        hasMultipleFinancingInstitutions:
          type: boolean
    AnalyzeInput:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [transactions, full]
    DebtBreakdownItem:
      type: object
      required:
        - lenderName
        - remainingAmount
        - startDate
      properties:
        lenderName:
          type: string
        remainingAmount:
          type: number
        startDate:
          type: string
        estimatedMonthlyBurden:
          type: number
    AnalyzeResult:
      type: object
      required:
        - type
        - summary
        - debtBreakdown
        - totalRemainingDebt
        - debtToIncomeRatio
        - insights
      properties:
        type:
          type: string
          enum: [transactions, full]
        summary:
          type: string
        debtBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/DebtBreakdownItem"
        totalRemainingDebt:
          type: number
        debtToIncomeRatio:
          type: number
        insights:
          type: array
          items:
            type: string
    RestructureStep:
      type: object
      required:
        - lenderName
        - action
        - detail
      properties:
        lenderName:
          type: string
        action:
          type: string
        detail:
          type: string
    RestructureResult:
      type: object
      required:
        - currentMonthlyBurden
        - targetMonthlyBurden
        - currentDebtToIncomeRatio
        - targetDebtToIncomeRatio
        - months
        - steps
      properties:
        currentMonthlyBurden:
          type: number
        targetMonthlyBurden:
          type: number
        currentDebtToIncomeRatio:
          type: number
        targetDebtToIncomeRatio:
          type: number
        months:
          type: integer
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RestructureStep"
    AdviceResult:
      type: object
      required:
        - advice
        - generatedAt
      properties:
        advice:
          type: string
        generatedAt:
          type: string
          format: date-time
    ConsolidationRequestResult:
      type: object
      required:
        - id
        - status
        - estimatedConsolidatedMonthlyPayment
        - institutionsIncluded
        - createdAt
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [submitted]
        estimatedConsolidatedMonthlyPayment:
          type: number
        institutionsIncluded:
          type: integer
        createdAt:
          type: string
          format: date-time
    LoanEligibilityResult:
      type: object
      required:
        - eligible
        - riskTier
        - creditScore
        - creditScoreLabel
        - creditScoreColor
        - guarantorBacked
        - recommendation
        - basedOnRealData
        - currentDebtToIncomePercentage
      properties:
        eligible:
          type: boolean
        riskTier:
          type: string
        creditScore:
          type: integer
          description: General credit score on a 300-850 scale.
        creditScoreLabel:
          type: string
        creditScoreColor:
          type: string
        guarantorBacked:
          type: boolean
        recommendedAmount:
          type: number
          nullable: true
        interestRate:
          type: number
          nullable: true
        termMonths:
          type: integer
          nullable: true
        monthlyInstallment:
          type: number
          nullable: true
        totalRepayment:
          type: number
          nullable: true
        recommendation:
          type: string
        basedOnRealData:
          type: boolean
        currentDebtToIncomePercentage:
          type: number

